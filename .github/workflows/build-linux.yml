name: Build Linux Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        sdk: [csgo]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            python3 \
            python3-pip \
            git \
            lib32stdc++6 \
            lib32z1 \
            libc6-dev-i386
          pip3 install git+https://github.com/alliedmodders/ambuild

      - name: Clone HL2SDK
        run: |
          git clone --depth 1 -b csgo https://github.com/alliedmodders/hl2sdk.git ../hl2sdk-csgo

      - name: Clone SourceMod
        run: |
          git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/sourcemod.git ../sourcemod
          cd ../sourcemod && git submodule update --init --depth 1

      - name: Clone Metamod:Source
        run: |
          git clone --depth 1 -b 1.11-dev https://github.com/alliedmodders/metamod-source.git ../metamod-source

      - name: Configure
        run: |
          mkdir build && cd build
          python3 ../configure.py \
            --hl2sdk-root "${{ github.workspace }}/.." \
            --sm-path "${{ github.workspace }}/../sourcemod" \
            --mms-path "${{ github.workspace }}/../metamod-source" \
            --sdks ${{ matrix.sdk }} \
            --enable-optimize

      - name: Build
        run: |
          cd build
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakequeries-linux-${{ matrix.sdk }}
          path: build/fakequeries/
